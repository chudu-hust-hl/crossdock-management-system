# Local development infrastructure. Start with: docker compose up -d
name: cross-dock-management

services:
  mongodb:
    image: mongo:8.0
    container_name: cross-dock-mongodb
    restart: unless-stopped
    ports:
      # Host port 27018 avoids clashing with a local MongoDB on 27017.
      # Bound to 127.0.0.1 because this local instance has no authentication.
      - '127.0.0.1:27018:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: cross-dock-management-rabbitmq
    restart: unless-stopped
    ports:
      # Host port 5673 avoids clashing with a local RabbitMQ on 5672.
      # Bound to 127.0.0.1 because this local broker uses the default guest user.
      - '127.0.0.1:5673:5672'
      - '127.0.0.1:15673:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:
    name: cross-dock-management-mongodb-data
  rabbitmq_data:
    name: cross-dock-management-rabbitmq-data
